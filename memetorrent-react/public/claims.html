<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim $MT Rewards | MemeTorrent</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; margin: 0; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 2em; background: linear-gradient(45deg, #a855f7, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; margin-top: 8px; font-size: 0.95em; }
        .panel { max-width: 1000px; margin: 0 auto 16px; padding: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; }
        .stats { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .stat { background: rgba(0,0,0,0.25); padding: 12px 18px; border-radius: 10px; text-align: center; min-width: 120px; }
        .stat b { display: block; font-size: 1.4em; color: #4ade80; }
        .stat span { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .wallet-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-primary { background: linear-gradient(45deg, #7c3aed, #a855f7); color: #fff; }
        .btn-claim { background: linear-gradient(45deg, #16a34a, #22c55e); color: #fff; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .wallet-opt { padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 12px; }
        .wallet-opt.active { border-color: #22c55e; background: rgba(34,197,94,0.15); }
        .connected { font-family: monospace; font-size: 12px; color: #86efac; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; }
        th { background: rgba(124,58,237,0.35); font-size: 11px; text-transform: uppercase; }
        tr.you { background: rgba(34,197,94,0.15); outline: 1px solid rgba(74,222,128,0.4); }
        tr.has-balance td.claimable { color: #4ade80; font-weight: 700; }
        .claimable { text-align: right; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; color: #cbd5e1; }
        .badge.ok { background: rgba(34,197,94,0.2); color: #86efac; }
        .status { margin-top: 12px; font-size: 13px; min-height: 1.2em; text-align: center; }
        .status.err { color: #fca5a5; }
        .status.ok { color: #86efac; }
        .success-box { display: none; margin-top: 14px; padding: 14px; border-radius: 10px; background: rgba(34,197,94,0.12); border: 1px solid rgba(74,222,128,0.4); }
        .success-box.visible { display: block; }
        .tx { font-family: monospace; font-size: 11px; word-break: break-all; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 8px; }
        input[type="search"] { flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #fff; color: #111; }
        .nav { text-align: center; margin-bottom: 12px; }
        .nav a { color: #93c5fd; margin: 0 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Claim Your $MT Rewards</h1>
        <div class="subtitle">Connect the wallet you set with <code>/setwallet</code> in Telegram — claim straight to your wallet</div>
    </div>
    <div class="nav">
        <a href="/claims">Claims (main site)</a>
        <a href="tally.html">← Leaderboard</a>
        <a href="https://t.me/mod_futuret3ch_bot">Telegram Bot</a>
        <a href="commands.html">Command Center</a>
    </div>

    <div class="panel">
        <div class="stats" id="summaryStats">
            <div class="stat"><b id="statPending">—</b><span>Pending $MT</span></div>
            <div class="stat"><b id="statUsers">—</b><span>With rewards</span></div>
            <div class="stat"><b id="statMembers">—</b><span>Members</span></div>
        </div>
    </div>

    <div class="panel">
        <div class="wallet-bar">
            <button type="button" class="wallet-opt active" data-p="phantom">Phantom</button>
            <button type="button" class="wallet-opt" data-p="solflare">Solflare</button>
            <button type="button" class="wallet-opt" data-p="backpack">Backpack</button>
            <button type="button" class="btn btn-primary" id="btnConnect">Connect wallet</button>
            <button type="button" class="btn btn-secondary" id="btnDisconnect" style="display:none">Disconnect</button>
            <span class="connected" id="walletLabel"></span>
            <button type="button" class="btn btn-claim" id="btnClaim" disabled>Claim my $MT</button>
        </div>
        <div class="status" id="claimStatus"></div>
        <div class="success-box" id="successBox">
            <strong>✅ Claim successful!</strong>
            <div id="successAmt"></div>
            <div class="tx" id="successTx"></div>
            <a id="successSolscan" href="#" target="_blank" rel="noopener" class="btn btn-secondary" style="display:inline-block;margin-top:10px;text-decoration:none">View on Solscan</a>
        </div>
    </div>

    <div class="panel">
        <input type="search" id="search" placeholder="Search @username or user ID…">
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Streak</th>
                    <th>Check-ins</th>
                    <th>Wallet</th>
                    <th class="claimable">Claimable $MT</th>
                </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:24px;color:#94a3b8">Loading…</td></tr></tbody>
        </table>
    </div>

    <script type="module">
        let allUsers = [];
        let connectedWallet = null;
        let selectedProvider = 'phantom';
        let myRow = null;

        const providers = {
            phantom: () => window.solana?.isPhantom ? window.solana : null,
            solflare: () => window.solflare?.isSolflare ? window.solflare : null,
            backpack: () => window.backpack?.isBackpack ? window.backpack : null,
        };

        document.querySelectorAll('.wallet-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.wallet-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedProvider = btn.dataset.p;
            });
        });

        async function loadList() {
            const res = await fetch('/api/claimable-rewards');
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Load failed');
            allUsers = data.users || [];
            document.getElementById('statPending').textContent = (data.summary?.pending_mt_total || 0).toLocaleString();
            document.getElementById('statUsers').textContent = data.summary?.users_with_balance || 0;
            document.getElementById('statMembers').textContent = data.summary?.total_users || 0;
            if (!data.treasury_configured) {
                setStatus('Rewards wallet is being set up — balances show below; claims open once treasury is live.', false);
            }
            renderTable();
            matchWallet();
        }

        function renderTable() {
            const q = (document.getElementById('search').value || '').toLowerCase().trim();
            const tbody = document.getElementById('tbody');
            const filtered = allUsers.filter(u => {
                if (!q) return true;
                return String(u.user_id).includes(q) || (u.username || '').toLowerCase().includes(q);
            });
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8">No matches</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(u => {
                const you = myRow && u.user_id === myRow.user_id;
                const cls = [u.claimable_mt > 0 ? 'has-balance' : '', you ? 'you' : ''].filter(Boolean).join(' ');
                return `<tr class="${cls}" data-uid="${u.user_id}">
                    <td>@${esc(u.username || 'user')}<br><span style="font-size:11px;color:#64748b">${u.user_id}</span></td>
                    <td>${u.current_streak}d <span style="color:#64748b">(max ${u.max_streak})</span></td>
                    <td>${u.total_checkins}</td>
                    <td>${u.wallet_linked ? '<span class="badge ok">Linked</span> ' + esc(u.wallet_short) : '<span class="badge">None</span>'}</td>
                    <td class="claimable">${u.claimable_mt > 0 ? u.claimable_mt.toLocaleString(undefined, {maximumFractionDigits: 2}) : '—'}</td>
                </tr>`;
            }).join('');
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function setStatus(msg, isErr) {
            const el = document.getElementById('claimStatus');
            el.textContent = msg || '';
            el.className = 'status' + (isErr ? ' err' : msg ? ' ok' : '');
        }

        async function matchWallet() {
            myRow = null;
            const btn = document.getElementById('btnClaim');
            if (!connectedWallet) {
                btn.disabled = true;
                btn.textContent = 'Claim my $MT';
                renderTable();
                return;
            }
            try {
                const res = await fetch('/api/claimable-rewards/lookup?wallet=' + encodeURIComponent(connectedWallet));
                const data = await res.json();
                if (!res.ok) {
                    btn.disabled = true;
                    setStatus(data.message || 'Wallet not linked — use /setwallet in Telegram first.', true);
                    renderTable();
                    return;
                }
                myRow = data;
                if (myRow.claimable_mt <= 0) {
                    btn.disabled = true;
                    setStatus(`@${myRow.username || 'you'}: no rewards to claim right now. Keep checking in!`, false);
                } else {
                    btn.disabled = false;
                    btn.textContent = `Claim ${myRow.claimable_mt.toLocaleString()} $MT`;
                    setStatus(`Ready — ${myRow.claimable_mt.toLocaleString()} $MT available for @${myRow.username || 'you'}`, false);
                }
            } catch (e) {
                btn.disabled = true;
                setStatus(e.message || 'Could not verify wallet', true);
            }
            renderTable();
        }

        async function connectWallet() {
            const p = providers[selectedProvider]?.();
            if (!p) {
                alert(selectedProvider + ' not detected. Install the extension or try another wallet.');
                return;
            }
            try {
                const resp = await p.connect();
                connectedWallet = resp?.publicKey?.toString?.() || p.publicKey?.toString?.();
                if (!connectedWallet) throw new Error('No public key');
                document.getElementById('walletLabel').textContent = connectedWallet.slice(0, 4) + '…' + connectedWallet.slice(-4);
                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('btnDisconnect').style.display = '';
                await matchWallet();
            } catch (e) {
                setStatus(e.message || 'Connect failed', true);
            }
        }

        function disconnectWallet() {
            connectedWallet = null;
            myRow = null;
            document.getElementById('walletLabel').textContent = '';
            document.getElementById('btnConnect').style.display = '';
            document.getElementById('btnDisconnect').style.display = 'none';
            document.getElementById('btnClaim').disabled = true;
            document.getElementById('successBox').classList.remove('visible');
            setStatus('', false);
            renderTable();
        }

        async function claimRewards() {
            if (!connectedWallet || !myRow || myRow.claimable_mt <= 0) return;
            const btn = document.getElementById('btnClaim');
            btn.disabled = true;
            setStatus('Sending $MT to your wallet…', false);
            document.getElementById('successBox').classList.remove('visible');
            try {
                const res = await fetch('/api/claimable-rewards/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wallet_address: connectedWallet }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || data.error || 'Claim failed');
                document.getElementById('successAmt').textContent =
                    `${data.amount_mt.toLocaleString()} $MT sent to your wallet`;
                document.getElementById('successTx').textContent = data.tx_signature;
                document.getElementById('successSolscan').href = data.solscan_url;
                document.getElementById('successBox').classList.add('visible');
                setStatus('Success! Balance updated on-chain.', false);
                await loadList();
            } catch (e) {
                setStatus(e.message || 'Claim failed', true);
                btn.disabled = false;
            }
        }

        document.getElementById('btnConnect').addEventListener('click', connectWallet);
        document.getElementById('btnDisconnect').addEventListener('click', disconnectWallet);
        document.getElementById('btnClaim').addEventListener('click', claimRewards);
        document.getElementById('search').addEventListener('input', renderTable);

        loadList().catch(e => setStatus(e.message, true));
    </script>
</body>
</html>
