# Example nginx config for mt-core (native MT node) on port 4001
# Use for api.futuret3ch.com.au
# Place in /etc/nginx/sites-available/mt-core
# Then: sudo ln -s /etc/nginx/sites-available/mt-core /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Run: sudo certbot --nginx -d api.futuret3ch.com.au
# Proxy the core calls.

server {
    listen 80;
    server_name api.futuret3ch.com.au;   # point A record to VPS IP, use certbot for https

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Increase for NFT mints with image data URLs (base64 can be large).
    # After certbot adds the 443 ssl server block, make sure it also has:
    #   client_max_body_size 20m;
    # (certbot may require manual edit or re-apply --nginx)
    client_max_body_size 20m;
}
