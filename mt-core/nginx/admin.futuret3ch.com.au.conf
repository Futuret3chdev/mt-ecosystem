# Nginx config for admin.futuret3ch.com.au
# This domain serves:
#   - The self-hosted MT Admin API + dashboard (mt-admin-api on port 4003)
#   - /static/* paths directly from disk (important: testers rely on /static/admin_messages.html)
#   - Tester/monitor Flask API on port 5000 (/api/discord_*, /api/telegram_*, /api/tester_*, etc.)
#
# CRITICAL: /static/ must be served statically and must NOT be proxied,
# otherwise https://admin.futuret3ch.com.au/static/admin_messages.html will break.
#
# Place in /etc/nginx/sites-available/admin.futuret3ch.com.au
# Then:
#   sudo ln -s /etc/nginx/sites-available/admin.futuret3ch.com.au /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.futuret3ch.com.au
#
# After certbot, the 443 block will be added. The location /static/ block below
# should remain effective (put it in the http server block before any catch-all).

server {
    listen 80;
    server_name admin.futuret3ch.com.au;

    # CRITICAL: Tester page + any /static/* must be served DIRECTLY FROM DISK.
    # ^~ gives this location highest priority (before regex or prefix matches).
    # This protects https://admin.futuret3ch.com.au/static/admin_messages.html for the company testers.
    # The source of truth is mt-admin-api/static/admin_messages.html in the repo.
    location ^~ /static/ {
        alias /opt/mt-ecosystem/mt-admin-api/static/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Staff portal: force no-cache so updates to staff.html and the login form are always fresh.
    location = /static/staff.html {
        alias /opt/mt-ecosystem/mt-admin-api/static/staff.html;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Proxies for the rich admin/tester monitor (Flask on 5000)
    location /api/discord_ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/telegram_ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user_details {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_logs {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_sessions {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_progress {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_status {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_export {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_rollup {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tester_notify {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/check_commands {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/activity_stats {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (dashboard, /api/*, health, etc.) goes to the mt-admin-api
    location / {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20m;
}

# HTTPS (443) block - this is usually added / managed by certbot.
# IMPORTANT: After running certbot --nginx, make sure this /static/ location
# also exists in the 443 server block (certbot often creates a separate server {} for SSL).
# If missing, /static/ over https will fall through to the proxy and break the tester page.
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.futuret3ch.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.futuret3ch.com.au/privkey.pem;
    server_name admin.futuret3ch.com.au;

    location ^~ /static/ {
