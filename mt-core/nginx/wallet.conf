# Example nginx config for wallet custom domain (proxy to Vercel deployment)
# OPTIONAL / ALTERNATIVE: only use if you want to terminate TLS + serve wallet. on your VPS nginx
# instead of direct DNS to Vercel (direct Vercel DNS is recommended for performance).
#
# If using this:
# - Keep A record for wallet.futuret3ch.com.au pointing to VPS IP
# - Deploy + certbot as below
#
# Place in /etc/nginx/sites-available/wallet
# Then: sudo ln -s /etc/nginx/sites-available/wallet /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Run: sudo certbot --nginx -d wallet.futuret3ch.com.au

server {
    listen 80;
    server_name wallet.futuret3ch.com.au;

    location / {
        proxy_pass https://infinite-wallet.vercel.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host infinite-wallet.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20m;
}