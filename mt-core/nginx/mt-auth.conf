# Example nginx config for mt-auth (account + backups) on port 4002
# Place in /etc/nginx/sites-available/mt-auth
# Then: sudo ln -s /etc/nginx/sites-available/mt-auth /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name auth.yourdomain.com;   # REQUIRED: point a domain/subdomain A record to your VPS IP.

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10m;
}
