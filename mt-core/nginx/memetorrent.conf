# Example nginx config for memetorrent marketing custom domain (proxy to Vercel deployment)
# OPTIONAL / ALTERNATIVE: only use if you want to terminate TLS + serve memetorrent.futuret3ch.com.au on your VPS nginx
# instead of direct DNS CNAME to Vercel (direct Vercel DNS/CNAME is recommended for performance, same as wallet).
#
# This is the memetorrent equivalent of the wallet setup you showed working:
#   ls -la /etc/nginx/sites-available/ (with wallet conf)
#   cat wallet.conf (the one proxying to infinite-wallet.vercel.app + certbot comments)
#   Valid in Vercel after correct records.
#
# "because we need do the same now for memetorrent"
#
# If using this:
# - Keep A record for memetorrent.futuret3ch.com.au pointing to VPS IP (161.97.106.182)
# - (Or use temporarily while sorting DNS/CNAME for the memetorrent-react Vercel project)
# - Deploy + certbot as below
#
# Place in /etc/nginx/sites-available/memetorrent (or memetorrent.futuret3ch.com.au for clarity)
# Then:
#   sudo ln -s /etc/nginx/sites-available/memetorrent /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run:
#   sudo certbot --nginx -d memetorrent.futuret3ch.com.au
#
# After certbot, it will add the 443 SSL server block. Ensure client_max_body_size 20m; is present
# in both 80 and 443 blocks (for any future large payloads or consistency with wallet/api).

server {
    listen 80;
    server_name memetorrent.futuret3ch.com.au;

    location / {
        proxy_pass https://memetorrent-react.vercel.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host memetorrent-react.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20m;
}
